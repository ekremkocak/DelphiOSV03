[Description]
; ============================================================
; SYSTEMS.INI - Sistem Ayarlari Dosyasi
; ============================================================
; 
; [DesktopColor]
; 0 = Mavi (Varsayilan)
; 1 = Yesil
; 2 = Kirmizi
; 3 = Gri
; 4 = Mor
; 5 = Turuncu
; 6 = Siyah
;
; [ThemeMode]
; 0 = Acik Tema
; 1 = Koyu Tema
;
; [Language]
; 0 = Turkce
; 1 = English
; 2 = Deutsch
;
; [FontSize]
; 0 = Kucuk (8pt)
; 1 = Normal (10pt) - Varsayilan
; 2 = Orta (12pt)
; 3 = Buyuk (14pt)
; 4 = Cok Buyuk (16pt)
;
; [NetDriver]
; NetDriver = Ag surucu adi (Ornek: RTL8139, E1000, vb)
; Gateway = Varsayilan agi geidi (Ornek: 192.168.1.1)
; DNS = DNS sunucusu (Ornek: 8.8.8.8)
;
; [UserInfo]
; Username = Kullanici adi
; Password = Sifre (bos birakilabilir)
; AutoLogin = Yes/No - Otomatik giris yap
;
; [Display]
; Resolution = 0 = 640x480
;             1 = 800x600
;             2 = 1024x768 (Varsayilan)
;             3 = 1280x1024
;             4 = 1600x1200
; 
; RefreshRate = 0 = 60 Hz (Varsayilan)
;              1 = 75 Hz
;              2 = 85 Hz
;              3 = 100 Hz
;
; VSync = Yes/No - Dikey senkronizasyon
;
; [Sound]
; Volume = 0-100 (Varsayilan: 75)
; Mute = Yes/No
;
; [Advanced]
; AutoUpdate = Yes/No - Otomatik guncelleme
; DebugMode = Yes/No - Hata ayiklama modu
; CacheClear = Yes/No - Cikisda onbellek temizle
;
; ============================================================
